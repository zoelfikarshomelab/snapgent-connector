name: Release

# Release = promote the good snapshot to a clean release. No rebuild.
# Snapshot already built and verified the commit, so Release just re-uses
# those exact files. What you tested is what you ship.
#
#   v3.9.43   a release (clean version, no suffix).
#
# Pre-releases are NOT here. Use the Snapshot workflow for those:
#   Actions -> Snapshot -> Run workflow -> branch main
#   publishes v3.9.43-<short hash> as a pre-release. Many snapshots can share
#   the same version, each one is just a different commit. No version lock.
#   Version inside the files is always 3.9.43 (no hash) - the hash is only
#   in the Snapshot release tag name.
# When one snapshot is good, tag v<version> on that SAME commit to promote
# it here. If there is no snapshot for the tagged commit, Release fails
# and tells you to run Snapshot first. It never falls back to an older
# snapshot, because the code would be different.
#
# The tag version must match the version in the code. A tag with a suffix
# (e.g. v3.9.43-abc1234) is refused - run Snapshot instead.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      snapshot_tag: ${{ steps.version.outputs.snapshot_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          code="$(PYTHONPATH=server python3 -c 'from snapgent_bridge import BRIDGE_VERSION; print(BRIDGE_VERSION)')"
          name="${GITHUB_REF_NAME#v}"
          if [ "$name" != "${name%%-*}" ]; then
            echo "Release tags must be clean (v$code). Tag $GITHUB_REF_NAME has a suffix - use Actions -> Snapshot -> Run workflow for pre-releases." >&2
            exit 1
          fi
          if [ "$name" != "$code" ]; then
            echo "Tag v$name does not match the version in the code ($code)." >&2
            exit 1
          fi
          echo "version=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "snapshot_tag=v$name-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Will promote snapshot v$name-${GITHUB_SHA::7} to $GITHUB_REF_NAME if it exists."

  verify-snapshot:
    name: Snapshot exists for this commit
    needs: [check-version]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          snapshot="${{ needs.check-version.outputs.snapshot_tag }}"
          if ! gh release view "$snapshot" --json tagName --jq '.tagName'; then
            echo "No snapshot release $snapshot for this commit. Run Actions -> Snapshot -> Run workflow on branch main first, then tag." >&2
            exit 1
          fi
          echo "Found snapshot $snapshot - will promote its exact files." 




  publish:
    needs: [check-version, verify-snapshot]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the snapshot files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          snapshot="${{ needs.check-version.outputs.snapshot_tag }}"
          mkdir -p snapshot-files
          gh release download "$snapshot" --dir snapshot-files
          ls -lh snapshot-files
      - name: Publish clean release from snapshot files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.check-version.outputs.version }}"
          tag="${{ needs.check-version.outputs.tag }}"
          gh release create "$tag" "snapshot-files/snapgent.exe" "snapshot-files/snapgent-extension-v$v.zip" "snapshot-files/snapgent-linux-x64-v$v.tar.gz" \
            --title "snapgent $tag" --notes-file CHANGELOG.md --verify-tag
