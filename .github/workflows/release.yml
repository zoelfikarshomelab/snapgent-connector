name: Release

# Release = build only. The checks already ran in CI when the commit was pushed to main, so a tag does not repeat them;
# it only refuses to build a commit whose CI run on main is not green.
#
#   v3.9.4            a release.
#   v3.9.4-2d400bf    a pre-release (snapshot): the same version plus the short hash of the tagged commit.
#
# The version part must match the version in the code; a hash that is not the tagged commit is refused.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          name="${GITHUB_REF_NAME#v}"
          tag="${name%%-*}"
          suffix="${name#"$tag"}"
          code="$(PYTHONPATH=server python3 -c 'from snapgent_bridge import BRIDGE_VERSION; print(BRIDGE_VERSION)')"
          if [ "$tag" != "$code" ]; then
            echo "Tag v$tag does not match the version in the code ($code)." >&2
            exit 1
          fi
          if [ -n "$suffix" ]; then
            hash="${suffix#-}"
            if ! printf '%s' "$hash" | grep -Eq '^[0-9a-f]{7,40}$' || [ "${GITHUB_SHA#"$hash"}" = "$GITHUB_SHA" ]; then
              echo "A pre-release tag must look like v$tag-<hash of the tagged commit>; the commit is ${GITHUB_SHA::7}." >&2
              exit 1
            fi
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  verify-ci:
    name: CI is green on this commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      # The tag is often pushed right after main, so the CI run may still be going: wait for it (up to 30 minutes).
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for _ in $(seq 1 60); do
            run="$(gh run list --workflow ci.yml --branch main --event push --commit "$GITHUB_SHA" --limit 1 \
              --json status,conclusion,url --jq '.[] | "\(.status) \(.conclusion) \(.url)"')"
            if [ -z "$run" ]; then
              echo "No CI run on main for ${GITHUB_SHA::7} yet."
            else
              read -r status conclusion url <<< "$run"
              echo "CI run: $status ($conclusion) $url"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then exit 0; fi
                echo "CI is not green on this commit ($conclusion): not releasing." >&2
                exit 1
              fi
            fi
            sleep 30
          done
          echo "No finished CI run on main for ${GITHUB_SHA::7}: push the commit to main and wait for CI before tagging." >&2
          exit 1

  extension:
    needs: [check-version, verify-ci]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: extension/dist
          if-no-files-found: error

  windows-binaries:
    needs: [check-version, verify-ci]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller websockets
      - run: pyinstaller --noconfirm snapgent.spec
        working-directory: server
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: server/dist/snapgent.exe
          if-no-files-found: error

  linux-binary:
    needs: [check-version, verify-ci]
    runs-on: ubuntu-22.04   # built on an older glibc so the program runs on older distributions too
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller websockets
      - run: pyinstaller --noconfirm snapgent.spec
        working-directory: server
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: server/dist/snapgent
          if-no-files-found: error

  publish:
    needs: [check-version, extension, windows-binaries, linux-binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: extension-dist
          path: extension-dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: windows-binary
      - uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: linux-binary
      - name: Assemble the release
        run: >
          python3 scripts/package_release.py
          --version "${{ needs.check-version.outputs.version }}"
          --extension-dist extension-dist
          --windows-binary windows-binary/snapgent.exe
          --linux-binary linux-binary/snapgent
          --out out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.check-version.outputs.version }}"
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" "out/snapgent.exe" "out/snapgent-extension-v$v.zip" "out/snapgent-linux-x64-v$v.tar.gz" \
            --title "snapgent ${GITHUB_REF_NAME}" --notes-file CHANGELOG.md --verify-tag $flags
