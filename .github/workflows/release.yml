name: Release

# Push a tag like v3.9.4 to build and publish a release. The tag must match the version in the code;
# a suffix (v3.9.4-beta1) makes it a pre-release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          tag="${tag%%-*}"
          code="$(PYTHONPATH=server python3 -c 'from snapgent_bridge import BRIDGE_VERSION; print(BRIDGE_VERSION)')"
          if [ "$tag" != "$code" ]; then
            echo "Tag v$tag does not match the version in the code ($code)." >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  extension:
    needs: check-version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: extension/dist
          if-no-files-found: error

  windows-binaries:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller websockets
      - name: Configure git identity for the tests that make commits
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - run: python -m unittest discover -s tests -t .
      - run: pyinstaller --noconfirm snapgent.spec
        working-directory: server
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: server/dist/snapgent.exe
          if-no-files-found: error

  linux-binary:
    needs: check-version
    runs-on: ubuntu-22.04   # built on an older glibc so the program runs on older distributions too
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller websockets
      - name: Configure git identity for the tests that make commits
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - run: python -m unittest discover -s tests -t .
      - run: pyinstaller --noconfirm snapgent.spec
        working-directory: server
      - name: The program starts and answers as the Snapgent MCP server
        working-directory: server
        run: |
          ./dist/snapgent --version
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | timeout 20 ./dist/snapgent --mcp | grep -q '"serverInfo"'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: server/dist/snapgent
          if-no-files-found: error

  publish:
    needs: [check-version, extension, windows-binaries, linux-binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: extension-dist
          path: extension-dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: windows-binary
      - uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: linux-binary
      - name: Assemble the release
        run: >
          python3 scripts/package_release.py
          --version "${{ needs.check-version.outputs.version }}"
          --extension-dist extension-dist
          --windows-binary windows-binary/snapgent.exe
          --linux-binary linux-binary/snapgent
          --out out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.check-version.outputs.version }}"
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" "out/snapgent.exe" "out/snapgent-extension-v$v.zip" "out/snapgent-linux-x64-v$v.tar.gz" \
            --title "snapgent ${GITHUB_REF_NAME}" --notes-file CHANGELOG.md --verify-tag $flags
