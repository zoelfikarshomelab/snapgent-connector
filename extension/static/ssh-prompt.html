<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>snapgent · SSH</title>
  <style>
    :root { --bg: #16161a; --surface: #26262e; --border: rgba(255, 255, 255, 0.12); --text: #e8e8ec; --muted: rgba(232, 232, 236, 0.65); --accent: #7c8cff; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 18px; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
    h1 { margin: 0 0 10px; font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
    .text { margin: 0 0 14px; font-size: 13px; line-height: 1.5; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 150px; overflow: auto; }
    .secret { width: 100%; padding: 9px 10px; margin-bottom: 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; font-size: 14px; }
    .secret:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .buttons { display: flex; justify-content: flex-end; gap: 8px; }
    button { min-width: 84px; padding: 8px 14px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 600; color: var(--text); background: var(--surface); }
    button.ok { background: var(--accent); border-color: var(--accent); color: #101018; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script src="ssh-prompt.js"></script>
</body>
</html>
